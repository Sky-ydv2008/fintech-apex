<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8000" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="#0A0B10" stroke="url(#glow)" stroke-width="2" />
  <!-- Three nodes triangle -->
  <polygon points="50,22 75,68 25,68" stroke="url(#glow)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <circle cx="50" cy="22" r="7" fill="url(#glow)" filter="url(#shadow)" />
  <circle cx="75" cy="68" r="7" fill="url(#glow)" filter="url(#shadow)" />
  <circle cx="25" cy="68" r="7" fill="url(#glow)" filter="url(#shadow)" />
  <circle cx="50" cy="50" r="9" fill="#FFFFFF" opacity="0.9" />
</svg>
